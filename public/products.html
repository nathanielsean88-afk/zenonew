<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk — Zeno Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { position:relative; z-index:1; padding:110px 20px 32px; text-align:center; }
        .page-hero h1 { font-size:clamp(1.8rem,5vw,3rem); font-weight:700; letter-spacing:-1.5px; margin-bottom:8px; }
        .page-hero p { color:var(--text2); font-size:0.9rem; max-width:400px; margin:0 auto; }

        .filter-bar { position:relative; z-index:1; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 16px 28px; }
        .filter-btn { padding:8px 20px; border-radius:100px; font-family:'Space Grotesk',sans-serif; font-size:0.8rem; font-weight:600; cursor:pointer; transition:all 0.2s; border:1px solid var(--border2); background:transparent; color:var(--text2); }
        .filter-btn.active, .filter-btn:hover { background:rgba(139,92,246,0.15); border-color:var(--purple); color:var(--purple2); }

        .products-wrap { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:0 16px 60px; }
        .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }

        footer { position:relative; z-index:1; text-align:center; padding:24px; border-top:1px solid var(--border2); color:var(--muted); font-size:0.8rem; }
        .footer-logo { font-weight:700; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

        @media(max-width:600px) {
            .products-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
            .product-img-wrap { height:120px; }
            .product-body { padding:10px; }
            .product-desc { display:none; }
            .product-name { font-size:0.82rem; }
        }
    </style>
</head>
<body>
    <div class="bg-anim"><div class="bg-grid"></div><div class="bg-orb bg-orb-1"></div><div class="bg-orb bg-orb-2"></div><div class="bg-orb bg-orb-3"></div></div>

    <nav>
        <a href="/" class="nav-logo">ZenoStore</a>
        <ul class="nav-links">
            <li><a href="/products" style="color:var(--purple2)">Produk</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
        </ul>
        <div class="nav-buttons" id="navButtons"></div>
    </nav>

    <div class="page-hero">
        <div class="section-label">Katalog</div>
        <h1>Semua Produk</h1>
        <p>Plugin, Asset, Backup Server, dan Jasa Website untuk Minecraft kamu</p>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filter('all',this)">Semua</button>
        <button class="filter-btn" onclick="filter('plugin',this)">Plugin</button>
        <button class="filter-btn" onclick="filter('asset',this)">Asset</button>
        <button class="filter-btn" onclick="filter('backup',this)">Backup</button>
        <button class="filter-btn" onclick="filter('jasa',this)">Jasa</button>
    </div>

    <div class="products-wrap">
        <div class="products-grid" id="productsGrid">
            <div class="product-card"><div class="product-img-wrap skeleton"></div><div class="product-body"><div class="skeleton" style="height:10px;width:50%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;"></div></div></div>
            <div class="product-card"><div class="product-img-wrap skeleton"></div><div class="product-body"><div class="skeleton" style="height:10px;width:50%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;"></div></div></div>
            <div class="product-card"><div class="product-img-wrap skeleton"></div><div class="product-body"><div class="skeleton" style="height:10px;width:50%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;"></div></div></div>
            <div class="product-card"><div class="product-img-wrap skeleton"></div><div class="product-body"><div class="skeleton" style="height:10px;width:50%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;"></div></div></div>
        </div>
    </div>

    <footer><p>© 2024 <span class="footer-logo">ZenoStore</span> — All Rights Reserved</p></footer>

    <script>
        const user = JSON.parse(localStorage.getItem('zenoUser') || 'null');
        const catIcons = { plugin:'🔌', asset:'🎨', backup:'💾', jasa:'🌐' };
        let allProducts = [];

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            if (!list.length) { grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">Tidak ada produk</div>'; return; }
            grid.innerHTML = list.map(p => `
                <div class="product-card">
                    <div class="product-img-wrap">
                        <img src="/${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div class="product-img-fallback"><div class="fi">${catIcons[p.cat]||'📦'}</div><span>${p.catLabel}</span></div>
                        <div class="product-overlay"></div>
                        ${p.badge?'<div class="product-badge-pos"><span class="badge badge-purple">'+p.badge+'</span></div>':''}
                    </div>
                    <div class="product-body">
                        <div class="product-cat">${p.catLabel}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-footer">
                            <div class="product-price">${p.price}</div>
                            <a href="/checkout?id=${p.id}" class="btn-buy" onclick="return checkLogin(event)">Beli</a>
                        </div>
                    </div>
                </div>`).join('');
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                allProducts = data.products;
                renderProducts(allProducts);
            } catch { document.getElementById('productsGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Gagal memuat. Refresh halaman.</div>'; }
        }

        function filter(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat==='all' ? allProducts : allProducts.filter(p=>p.cat===cat));
        }

        function checkLogin(e) {
            if (!user) { e.preventDefault(); if(confirm('Kamu harus login dulu. Mau login sekarang?')) location.href='/login'; return false; }
            return true;
        }

        loadProducts();
    </script>
    <script src="/navbar.js"></script>
    <script>initNavbar('products');</script>
</body>
</html>
